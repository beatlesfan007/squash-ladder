version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: squash_ladder_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: squash_ladder
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
